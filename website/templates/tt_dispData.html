{% extends "base.html" %}
{% block title %}Parent Department{% endblock %}
{% block content %}
<p class="subHead">
    <a href="{{ url_for('main.logout') }}" style="color: rgb(241, 229, 229);background-color: rgb(106, 106, 244);">Logout</a>
    Welcome:  Logged in as: {{ username }}
</p>
<br/>
<form action="/tt_dispData" method="post" class="tt_data_form">
   <main1 class="tt_main">
        <div class = "tt_box" style="text-align: right;">
            Department: 
        </div>
        <div class = "tt_box" >
            <select name="department" style="padding: 3px;color: white;">
                <option disabled {% if not selected_dept %}selected{% endif %} value=" " >Department List</option>
                {% for department in departments %}
                <option value="{{ department }}" {% if department == selected_dept %}selected{% endif %} 
                        style="color: white;">{{ department }} </option>
                {% endfor %}
            </select> 
        </div>    
         <div class = "tt_box">
            <button {% if lock_dept %}disabled{% endif %} 
            type="submit" 
            name="dept_but" 
            value="department" 
            id="tt_but"            
            >SELECT</button>
        </div> 
        <div class = "tt_box">
            <button {% if not selected_dept %}disabled{% endif %} 
            type="submit" 
            name="dept_but" 
            value="cancel" 
            id="tt_but"            
            >CANCEL</button>
        </div>
    </div>
    </main1>

     <main5 class="tt_main">
        <div class = "tt_box" style="text-align: right;">
            Semester: 
        </div>
        <div class = "tt_box" >
            <select name="semester" style="color: white;padding: 3px;">
                <option disabled {% if not selected_semester %}selected{% endif %} value=" ">Semester List</option>
                {% for semester in semesters %}
                <option value="{{ semester }}" {% if semester == selected_semester %}selected{% endif %} 
                    style="color: white;">{{ semester }} </option>
                {% endfor %}
            </select> 
        </div> 
         <div class = "tt_box">
            <button {% if lock_semester %}disabled{% endif %} 
            type="submit" 
            name="semester_but" 
            value="semester" 
            id="tt_but"            
            >SELECT</button>
        </div> 
        <div class = "tt_box">
            <button {% if not selected_semester %}disabled{% endif %} 
            type="submit" 
            name="semester_but" 
            value="cancel" 
            id="tt_but"            
            >CANCEL</button>
        </div>       
    </div>
    </main5> 
    <main8 class="tt_main">
        <div class="tt_box">
            <button
            type="submit"
            name="end_but"
            value="cancel"
            id="tt_but">RESET-HOME</button>
        </div>
        <div class="tt_box">
            <button {% if lock_continue %}disabled{% endif %}
            type="submit"
            name="end_but"
            value="view_tt"
            id="tt_but">VIEW TIME TABLE</button>
        </div>
    </main8>
    <br/>
    
</form>
{% endblock %}
